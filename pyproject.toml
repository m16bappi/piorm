[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "piorm"
version = "0.1.0"
description = "A Django-like async ORM for Python, built on Rust with sea-query + sqlx"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
keywords = ["orm", "database", "async", "sqlite", "postgres", "mysql", "rust", "django"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
piorm = "piorm._cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "pytest-benchmark>=4.0",
]
dev = [
    "mypy>=1.10",
    "pyright>=1.1",
    "ruff>=0.4",
    "maturin>=1.7",
]

# ── Dependency groups (uv / PEP 735) ─────────────────────────────────────────
# Install with: uv sync --all-groups
# Or selectively: uv sync --group dev --group test

[dependency-groups]
dev = [
    "maturin>=1.7,<2.0",
    "mypy>=1.10",
    "pyright>=1.1",
    "ruff>=0.4",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]",
    "pytest-benchmark>=5.2.3",
]

# ── uv configuration ──────────────────────────────────────────────────────────

[tool.uv]
# Invalidate the uv cache when Cargo.lock changes so the extension is rebuilt.
cache-keys = [{ git = true }, { file = "Cargo.lock" }]

# ── maturin configuration ─────────────────────────────────────────────────────

[tool.maturin]
manifest-path = "piorm-py/Cargo.toml"
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "piorm._core"

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["__tests__"]
addopts = "--tb=short"

# ── ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["piorm"]

# ── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["piorm"]

# ── pyright ───────────────────────────────────────────────────────────────────

[tool.pyright]
pythonVersion = "3.12"
include = ["python"]
