[project]
name = "piorm-benchmarks"
version = "0.1.0"
description = "CRUD benchmarks: piorm vs Django ORM vs SQLAlchemy"
requires-python = ">=3.10"
dependencies = [
    "django>=5.0",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "rich>=13.0",
]

[tool.uv]
environments = ["sys_platform != 'dummy'"]
