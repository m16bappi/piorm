[workspace]
resolver = "2"
members = [
    "piorm-core",
    "piorm-py",
    "piorm-cli",
]
exclude = ["sea-query"]

[workspace.dependencies]
# Shared versions to keep consistent
sqlx            = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "postgres", "chrono", "uuid", "json"] }
sea-query       = { version = "1.0.0-rc.32", features = [
                    "backend-sqlite", "backend-mysql", "backend-postgres",
                    "with-chrono", "with-uuid", "with-json", "derive" ] }
tokio           = { version = "1", features = ["full"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
thiserror       = "1"
once_cell       = "1"
pyo3            = { version = "0.22", features = ["extension-module", "abi3-py312"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }
clap            = { version = "4", features = ["derive", "color", "env"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal    = "1"
futures         = "0.3"
