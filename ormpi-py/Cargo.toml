[package]
name = "ormpi-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "ormpi"
crate-type = ["cdylib"]

[dependencies]
ormpi-core = { path = "../ormpi-core" }
ormpi-cli = { path = "../ormpi-cli" }
clap.workspace = true
indexmap = "2"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312", "multiple-pymethods"] }
pyo3-async-runtimes.workspace = true
tokio.workspace = true
once_cell.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
